name: desktop

# The macOS desktop app (packages/desktop), on a `desktop-v1.2.3` tag: built for Apple silicon and
# Intel and published as the release for the tag, with latest-mac.yml, the feed the app checks the
# repository's latest release for. Pull requests touching the app only build it.
#
# Pull requests build an unsigned artifact. Tagged releases require a Developer ID Application
# certificate and App Store Connect API key, then verify the signature and stapled notarization
# ticket before anything is published. See packages/desktop/README.md for the one-time setup.

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    paths:
      - packages/desktop/**
      - .github/workflows/desktop.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Check the tag names the version in package.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version=$(bun -e "console.log(require('./packages/desktop/package.json').version)")
          if [[ "${GITHUB_REF_NAME}" != "desktop-v${version}" ]]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} but packages/desktop/package.json says ${version}."
            exit 1
          fi
      - if: github.event_name == 'pull_request'
        name: Build the unsigned pull-request artifact
        run: bun run --cwd packages/desktop package
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        name: Require Apple release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required release secrets: ${missing[*]}"
            exit 1
          fi
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        name: Prepare the notarization key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          umask 077
          printf '%s' "${APPLE_API_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        name: Build, sign and notarize the release
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run --cwd packages/desktop package:release
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        name: Verify the signatures and notarization tickets
        run: |
          app_count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "${app}"
            xcrun stapler validate "${app}"
            spctl --assess --type exec --verbose=2 "${app}"
            app_count=$((app_count + 1))
          done < <(find packages/desktop/release -type d -name '*.app' -prune -print0)
          if [[ "${app_count}" -ne 2 ]]; then
            echo "::error::Expected two signed apps, found ${app_count}."
            exit 1
          fi
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Personal Agent Proxy for macOS ${GITHUB_REF_NAME#desktop-v}" \
            --generate-notes \
            packages/desktop/release/*.dmg \
            packages/desktop/release/*.zip \
            packages/desktop/release/*.blockmap \
            packages/desktop/release/latest-mac.yml
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/latest-mac.yml
          if-no-files-found: error
