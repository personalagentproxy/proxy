<!doctype html>
<html lang="en" data-theme-storage-key="proxy-ui-theme">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg"
			media="(prefers-color-scheme: light)"
		/>
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon-dark.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<title>Personal Agent Proxy</title>
		<style>
			/* The page's own colors until the stylesheet arrives, so the first paint is not white.
			   Same values as --background in src/index.css. */
			html {
				background: oklch(1 0 0);
				color-scheme: light;
			}
			html.dark {
				background: oklch(0.145 0 0);
				color-scheme: dark;
			}
		</style>
		<script>
			// Applies the saved theme before the first paint so the page never flashes the other one.
			let savedTheme = null;
			try {
				savedTheme = localStorage.getItem(document.documentElement.dataset.themeStorageKey);
			} catch {
				// Storage can be unavailable in privacy-restricted browser contexts.
			}
			const systemIsDark = matchMedia('(prefers-color-scheme: dark)').matches;
			const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && systemIsDark);
			document.documentElement.classList.add(isDark ? 'dark' : 'light');
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
